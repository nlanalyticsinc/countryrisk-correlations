[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "countryrisk-replication"
version = "0.1.0"
description = "Correlation checks for reproduced NLA country-risk scores against original paper-based country-risk measures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbconvert>=7",
]
test = [
    "numpy>=1.26",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
