name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Python 3.12 checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

  compatibility:
    name: Python 3.10 / pandas 2.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install floor dependencies
        run: python -m pip install "numpy<2" "pandas==2.0.*" -e ".[test]"

      - name: Test
        run: python -m pytest
